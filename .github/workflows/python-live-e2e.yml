# Live end-to-end test: install -> messaging with real Claude CLI subprocesses.
#
# TRIGGER RATIONALE
# -----------------
# Triggered on push to main (not every PR) to avoid per-PR token spend.
# Each run costs ~$0.30-$1.50 in Anthropic API tokens (two claude-sonnet-4-5
# agents, max-budget-usd $0.10 each, but realistic full runs average higher).
# workflow_dispatch supports manual debug runs.
# Weekly cron (Sunday 06:00 UTC) catches upstream claude CLI drift without
# requiring a code push.
#
# PATH FILTER
# -----------
# Push to main is further filtered to paths that could affect the live test:
# packages/python/, plugins/sox-plugin-schema-strict/, the test file itself,
# the fixture dir, and this workflow. Unrelated changes (docs/, spec/, etc.)
# do not trigger a live run.
#
# CLAUDE CLI INSTALL
# ------------------
# The claude CLI is distributed as an npm package: @anthropic-ai/claude-code.
# We install it globally via npm (Node 20 is pre-installed on ubuntu-latest).
# We do NOT pin a specific version here; the live test itself gates on the
# flags available in the version under test. If a CLI upgrade breaks the test,
# the weekly cron will surface it before the next push to main.
# See preflight-resolutions.md for the verified flag set (v2.1.126 baseline).
#
# SECRET GUARD
# ------------
# The live job is gated on secrets.ANTHROPIC_API_KEY != ''. Forks and
# contributor PRs that don't have the secret configured will silently skip
# the entire job (GitHub evaluates the if: expression before scheduling).
# The regular CI job (python-ci.yml) never passes -m live, so live tests
# never run in ordinary CI regardless of this workflow.

name: Python Live E2E

on:
  push:
    branches:
      - main
    paths:
      - "packages/python/**"
      - "plugins/sox-plugin-schema-strict/**"
      - "packages/python/tests/integration/test_live_install_e2e.py"
      - "packages/python/tests/fixtures/live_install/**"
      - ".github/workflows/python-live-e2e.yml"
  workflow_dispatch:
    inputs:
      debug_verbose:
        description: "Pass -s to pytest for verbose subprocess output"
        required: false
        default: "false"
  schedule:
    # Weekly cron: Sunday 06:00 UTC — catches upstream claude CLI drift
    - cron: "0 6 * * 0"

jobs:
  # GitHub Actions does not allow `secrets.*` in job-level `if:` expressions
  # (it raises "Unrecognized named-value: 'secrets'" at workflow-validation
  # time). The documented pattern is a tiny "check" job that exposes the
  # secret's presence as an output, which downstream jobs can gate on.
  # The actual secret value never appears in logs — only a boolean flag.
  check-secret:
    name: Check ANTHROPIC_API_KEY presence
    runs-on: ubuntu-latest
    outputs:
      has-key: ${{ steps.probe.outputs.has-key }}
    steps:
      - id: probe
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            echo "has-key=true" >> "$GITHUB_OUTPUT"
            echo "ANTHROPIC_API_KEY secret is configured; live-e2e will run."
          else
            echo "has-key=false" >> "$GITHUB_OUTPUT"
            echo "ANTHROPIC_API_KEY secret is NOT configured; live-e2e will be skipped."
          fi

  live-e2e:
    name: Live Install E2E (claude CLI + real API)
    runs-on: ubuntu-latest
    needs: check-secret
    # Silent skip when ANTHROPIC_API_KEY secret is not configured.
    # Safe for forks, contributor PRs, and repos that haven't opted in.
    if: needs.check-secret.outputs.has-key == 'true'
    timeout-minutes: 20

    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js 20 (for claude CLI install)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install claude CLI
        # Official distribution: npm package @anthropic-ai/claude-code.
        # --bare mode (used by the test) requires ANTHROPIC_API_KEY env var;
        # no keychain or OAuth session is needed in CI (see preflight-resolutions.md Q3).
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: Install uv
        run: pip install uv

      - name: Install SOX and dev dependencies
        # Install the main package + dev extras so pytest collection works.
        # The live test itself builds a separate tmp venv for isolation; this
        # step only needs enough installed for pytest to collect and run the file.
        working-directory: packages/python
        run: |
          uv pip install --system -e ".[dev]"

      - name: Install schema-strict plugin (required by live test venv)
        # The live test pip-installs this plugin into its tmp venv. Installing
        # it here ensures the sdist/wheel is resolvable from the repo root.
        run: |
          pip install -e plugins/sox-plugin-schema-strict || true

      - name: Run live E2E tests
        working-directory: ${{ github.workspace }}
        run: |
          PYTEST_EXTRA=""
          if [[ "${{ github.event.inputs.debug_verbose }}" == "true" ]]; then
            PYTEST_EXTRA="-s"
          fi
          python3 -m pytest -m live \
            packages/python/tests/integration/test_live_install_e2e.py \
            -v \
            --tb=short \
            ${PYTEST_EXTRA}

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-e2e-artifacts
          path: |
            /tmp/pytest-*/
          if-no-files-found: ignore
          retention-days: 7
