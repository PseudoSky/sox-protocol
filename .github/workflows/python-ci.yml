name: Python CI

on:
  push:
    paths:
      - "packages/python/**"
      - "spec/schemas/**"
      - "spec/conformance/**"
      - ".github/workflows/python-ci.yml"
  pull_request:
    paths:
      - "packages/python/**"
      - "spec/schemas/**"
      - "spec/conformance/**"
      - ".github/workflows/python-ci.yml"

defaults:
  run:
    working-directory: packages/python

jobs:
  # -------------------------------------------------------------------------
  # Unit + integration tests
  # -------------------------------------------------------------------------
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Install package and dev dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Ruff lint
        run: python -m ruff check src/ tests/

      - name: mypy --strict on core/
        run: python -m mypy --strict src/sox_protocol/core/

      - name: import-linter — core must not import adapters
        run: python -m lint-imports

      - name: pytest with coverage (100% on decide.py)
        run: |
          python -m pytest tests/unit/ \
            --cov=sox_protocol.core.enforcer.decide \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=100 \
            -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.python-version }}
          path: packages/python/coverage.xml

  # -------------------------------------------------------------------------
  # Language-neutral conformance suite (Milestone 6)
  # Runs spec/conformance/scenarios/*.json against the Python MCP server.
  # This job is the verification authority for SOX v1.0 compliance.
  # -------------------------------------------------------------------------
  conformance:
    name: Conformance Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Install package and dev dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Install curl and jq (conformance runner deps)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends curl jq

      - name: Run conformance suite (spec/conformance/scenarios/ vs Python impl)
        working-directory: ${{ github.workspace }}
        run: |
          python -m pytest \
            packages/python/tests/conformance/run_python_impl.py \
            -v \
            --tb=short \
            -m conformance \
            --no-header

      - name: Upload conformance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-results-py${{ matrix.python-version }}
          path: packages/python/tests/conformance/results/
          if-no-files-found: ignore

  # -------------------------------------------------------------------------
  # Write conformance badge result (only on push to main, Python 3.11)
  # -------------------------------------------------------------------------
  conformance-badge:
    name: Update Conformance Badge
    runs-on: ubuntu-latest
    needs: conformance
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Generate badge JSON (shields.io endpoint)
        run: |
          mkdir -p badges
          cat > badges/python-conformance.json << 'EOF'
          {
            "schemaVersion": 1,
            "label": "SOX conformance",
            "message": "v1.0 passing",
            "color": "brightgreen",
            "namedLogo": "checkmarx"
          }
          EOF
          echo "Badge JSON written to badges/python-conformance.json"

      - name: Commit badge JSON to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stash working tree, switch to gh-pages (create if absent)
          git fetch origin gh-pages 2>/dev/null || true
          if git ls-remote --heads origin gh-pages | grep -q gh-pages; then
            git checkout gh-pages
            git pull origin gh-pages --rebase
          else
            git checkout --orphan gh-pages
            git rm -rf . >/dev/null 2>&1 || true
          fi

          mkdir -p badges
          cat > badges/python-conformance.json << 'EOF'
          {
            "schemaVersion": 1,
            "label": "SOX conformance",
            "message": "v1.0 passing",
            "color": "brightgreen",
            "namedLogo": "checkmarx"
          }
          EOF

          git add badges/python-conformance.json
          git diff --cached --quiet || \
            git commit -m "chore: update python conformance badge [skip ci]"
          git push origin gh-pages
