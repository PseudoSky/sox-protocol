name: Python CI

on:
  push:
    paths:
      - "packages/python/**"
      - "spec/schemas/**"
      - "spec/conformance/**"
      - ".github/workflows/python-ci.yml"
  pull_request:
    paths:
      - "packages/python/**"
      - "spec/schemas/**"
      - "spec/conformance/**"
      - ".github/workflows/python-ci.yml"

defaults:
  run:
    working-directory: packages/python

jobs:
  # -------------------------------------------------------------------------
  # Unit + integration tests
  # -------------------------------------------------------------------------
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Install package and dev dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Ruff lint
        run: python -m ruff check src/ tests/

      - name: mypy --strict on core/
        run: python -m mypy --strict src/sox_protocol/core/

      - name: import-linter — core must not import adapters
        # The `import-linter` package ships a console script named
        # `lint-imports`. `python -m lint-imports` fails (hyphens aren't
        # valid module names); `python -m importlinter` fails (the
        # package has no __main__.py). The bin form is the documented
        # invocation.
        run: lint-imports

      - name: pytest with coverage (100% on decide.py)
        run: |
          python -m pytest tests/unit/ \
            --cov=sox_protocol.core.enforcer.decide \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=100 \
            -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.python-version }}
          path: packages/python/coverage.xml

  # -------------------------------------------------------------------------
  # Language-neutral conformance suite (Milestone 6)
  # Runs spec/conformance/scenarios/*.json against the Python MCP server.
  # This job is the verification authority for SOX v1.0 compliance.
  # -------------------------------------------------------------------------
  conformance:
    name: Conformance Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Install package and dev dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Install curl and jq (conformance runner deps)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends curl jq

      - name: Run conformance suite (spec/conformance/scenarios/ vs Python impl)
        working-directory: ${{ github.workspace }}
        run: |
          python -m pytest \
            packages/python/tests/conformance/run_python_impl.py \
            -v \
            --tb=short \
            -m conformance \
            --no-header

      - name: Upload conformance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-results-py${{ matrix.python-version }}
          path: packages/python/tests/conformance/results/
          if-no-files-found: ignore

  # -------------------------------------------------------------------------
  # Conformance badge generation lives in .github/workflows/conformance-badge.yml,
  # which is triggered by `workflow_run` after this workflow completes successfully
  # on main. Keeping it as a separate workflow avoids the bug this duplicate job
  # caused: it ran with cwd=packages/python (per the workflow's defaults.run),
  # so `mkdir -p badges` created `packages/python/badges/` as an untracked file,
  # which blocked `git checkout gh-pages` (the path is tracked on gh-pages, the
  # working-tree file was untracked). The standalone workflow writes to /tmp/
  # and only touches the working tree after the gh-pages checkout, sidestepping
  # the conflict entirely.
