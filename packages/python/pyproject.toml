[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sox-protocol"
version = "0.1.3"
description = "SOX Protocol — reference Python implementation of the inter-agent channels protocol."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20.0",
    "pydantic>=2.0.0",
    "fastmcp>=2.0.0",
    "jsonschema>=4.0.0",
    "pyyaml>=6.0",
    "packaging>=23.0",
    "textual>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
    "import-linter>=2.1.0",
    "datamodel-code-generator>=0.25.0",
    "types-jsonschema>=4.0.0",
    "types-PyYAML>=6.0",
]

[project.scripts]
sox-mcp-server = "sox_protocol.core.mcp_server.server:main"
sox-protocol = "sox_protocol.cli:main"

# Bundle spec/discipline/ + spec/VERSION into the wheel under sox_protocol/spec/
# via the in-tree symlink at packages/python/src/sox_protocol/spec → ../../../spec.
# Hatchling follows the symlink and packages the dereferenced files. This avoids
# the older [tool.hatch.build.targets.wheel.sources] approach (silently no-ops
# when the source path is outside the project root) AND the force-include
# approach (fails when the build runs in an isolated environment, since `../../`
# escapes the build root).
[tool.hatch.build.targets.wheel]
packages = ["src/sox_protocol"]
include-symlinks = true

[tool.hatch.build.targets.sdist]
include = [
    "src/",
]
include-symlinks = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers -m 'not live'"
markers = [
    "conformance: language-neutral conformance suite (spec/conformance/scenarios/)",
    "live: requires ANTHROPIC_API_KEY and the claude CLI; opts out by default",
]

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["sox_protocol"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90
omit = [
    # Textual rendering glue — lifecycle hooks and widget compose() methods
    # require a running Textual reactor (TTY / headless pilot) that is
    # impractical to instrument at unit-test coverage granularity.
    # Covered at smoke-test level in tests/tui/test_app_pilot.py.
    # See tests/tui/conftest.py for the documented rationale.
    "*/tui/app.py",
    "*/tui/widgets/*.py",
]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
# packages/python is the root; mypy discovers src/ via the explicit namespace
mypy_path = "src"
explicit_package_bases = true

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
# 120 covers most modern Python code; bumped from 99 (the historical default)
# during the 0.1.1 lint cleanup. A handful of method signatures with long
# type annotations still exceed even 120 — those are per-file-ignored below
# rather than re-broken across multiple lines for the sake of the linter.
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
# ANN101/ANN102 were removed in ruff >=0.5; the explicit ignore is harmless
# but ruff prints a warning. Keeping the entries documents the intent — we
# never wanted self/cls type annotations and don't want to opt back in if a
# future ruff revives the rules.
# SIM117 (combine `with` statements) is a stylistic-only suggestion that
# tends to make nested context managers harder to read in `async with` /
# `aiosqlite` heavy code; skipping globally.
# SIM102 (collapsible `if`) — same reasoning as SIM117 in places where the
# nested form is the more readable shape.
# ANN401 (any-type) is overly strict for fixture stubs and dynamic config
# helpers; we still want it on src/, just not as a hard fail.
ignore = [
    # ANN101/ANN102 (self/cls type-annotation rules) were removed in ruff>=0.5;
    # listing them here would now produce a "rule has been removed" warning.
    # Don't reintroduce them — we never wanted self/cls annotations.
    "SIM117",  # combine `with` — hurts readability of nested async with
    "SIM102",  # collapsible `if` — same reasoning
    "SIM108",  # ternary instead of if-else — produces 100+ char ternaries; readability tradeoff
    "ANN401",  # any-type — overly strict for fixture stubs and dynamic config
]

[tool.ruff.lint.per-file-ignores]
# Tests get extra leeway — annotations on test functions provide little
# value, and many test files use module-level setup (sys.path manipulation,
# importlib.util) before imports.
"tests/**/*.py" = [
    "ANN001",
    "ANN002",
    "ANN003",
    "ANN201",
    "ANN202",
    "ANN401",
    "E402",
    "E501",  # tests often have long mock setup lines and reference values
    "F841",  # unused vars in tests are usually intentional (capturing for inspection)
    "B018",  # bare-expression statements are sometimes intentional in tests
]
# Files with long async method signatures whose multi-line forms hurt readability:
"src/sox_protocol/adapters/transports/http/routes.py" = ["E501"]
"src/sox_protocol/adapters/backing_stores/sqlite/store.py" = ["E501"]
"src/sox_protocol/adapters/backing_stores/filesystem/store.py" = ["E501"]
"src/sox_protocol/adapters/backing_stores/memory/store.py" = ["E501"]
"src/sox_protocol/core/ports/backing_store.py" = ["E501"]
"src/sox_protocol/core/middleware/errors.py" = ["E501"]
"src/sox_protocol/core/middleware/plugins/store_dispatch.py" = ["E501"]

# ---------------------------------------------------------------------------
# import-linter
# ---------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["sox_protocol"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core must not import from adapters"
type = "forbidden"
source_modules = ["sox_protocol.core"]
forbidden_modules = ["sox_protocol.adapters"]
