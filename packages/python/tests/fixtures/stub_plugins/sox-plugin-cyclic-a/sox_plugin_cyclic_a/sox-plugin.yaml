apiVersion: sox.dev/v1
kind: SoxPlugin
metadata:
  id: io.sox.cyclic-a
  version: 1.0.0
  display_name: Cyclic-A Test Plugin
  description: Declares must_run_before cyclic-b; cyclic-b declares must_run_before cyclic-a. Creates a cycle.
spec:
  protocol_version: ">=1.0,<2.0"
  plugin_kind: interceptor
  must_run_before:
    - io.sox.cyclic-b
  signatures: []
