[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "sox-plugin-cyclic-a"
version = "1.0.0"
description = "Cyclic-A stub plugin for SOX Protocol integration tests"
requires-python = ">=3.11"

[project.entry-points."sox_protocol.plugins"]
"io.sox.cyclic-a" = "sox_plugin_cyclic_a:make_middleware"

[tool.setuptools.packages.find]
where = ["."]
include = ["sox_plugin_cyclic_a*"]

[tool.setuptools.package-data]
sox_plugin_cyclic_a = ["sox-plugin.yaml"]
