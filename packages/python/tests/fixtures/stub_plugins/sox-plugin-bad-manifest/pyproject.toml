[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "sox-plugin-bad-manifest"
version = "1.0.0"
description = "Bad-manifest stub plugin for SOX Protocol integration tests"
requires-python = ">=3.11"

[project.entry-points."sox_protocol.plugins"]
"io.sox.bad-manifest" = "sox_plugin_bad_manifest:make_middleware"

[tool.setuptools.packages.find]
where = ["."]
include = ["sox_plugin_bad_manifest*"]

[tool.setuptools.package-data]
sox_plugin_bad_manifest = ["sox-plugin.yaml"]
