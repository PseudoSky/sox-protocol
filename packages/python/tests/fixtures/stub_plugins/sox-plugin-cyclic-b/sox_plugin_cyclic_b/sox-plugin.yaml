apiVersion: sox.dev/v1
kind: SoxPlugin
metadata:
  id: io.sox.cyclic-b
  version: 1.0.0
  display_name: Cyclic-B Test Plugin
  description: Declares must_run_before cyclic-a; cyclic-a declares must_run_before cyclic-b. Creates a cycle.
spec:
  protocol_version: ">=1.0,<2.0"
  plugin_kind: interceptor
  must_run_before:
    - io.sox.cyclic-a
  signatures: []
