# SPDX-License-Identifier: Apache-2.0
name: unknown-credential-rejected
spec_ref: spec/ports/identity.md
description: >
  send with unrecognized credential returns sox-error; no message persisted.
  An agent with an invalid/unknown credential must be rejected before any
  backing-store access. The error must conform to sox-error envelope shape.

agents:
  - id: agent-unknown
    credential: INVALID-CREDENTIAL-THAT-DOES-NOT-EXIST

sequence:
  - id: rejected-send
    as_agent: agent-unknown
    operation: send
    input:
      channel: "test:rejected"
      body:
        type: status_update
        subject: should be rejected
    expected_error:
      error_code: "{{any_string}}"

assertions: []
