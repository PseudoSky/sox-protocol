# SPDX-License-Identifier: Apache-2.0
#
# Phase 07 fixture — P1 pipeline-integration
#
# Asserts that unknown-credential rejection is SERVER-SIDE (AuthMiddleware),
# not a client-side synthesized response.
#
# Distinguishing marker: error_code MUST be "identity_failure" — the exact
# value emitted by AuthMiddleware._make_identity_error() in
# packages/python/src/sox_protocol/core/middleware/plugins/auth.py.
#
# The legacy client-side substitution (tools/conformance_runner.py:805-813,
# deleted in phase 06) produced "unknown_agent" as error_code. Any
# implementation that still synthesises the rejection client-side will emit
# a different code and FAIL this fixture.
#
# Both send and recv are tested because both are identity-enforced operations
# (auth.py:_IDENTITY_ENFORCED_OPERATIONS). Passing both confirms the rejection
# is systematic — not an operation-specific special case.
#
# Phase 04 (observability) will add pipeline_trace to every dispatch response.
# When that lands, a stronger assertion becomes available:
#
#   assertions:
#     - type: response_metadata
#       step: rejected-send
#       path: "middleware_timings[0].middleware"
#       equals: "auth"
#     - type: response_metadata
#       step: rejected-send
#       path: "middleware_timings[0].verdict"
#       equals: "reject"
#
# Until phase 04 ships, error_code="identity_failure" + message present is the
# strongest verifiable assertion that the rejection comes from the auth plugin.

name: unknown-credential-rejected-server-side
spec_ref: spec/ports/identity.md
description: >
  An agent whose credential is not registered in the server's identity
  registry receives error_code="identity_failure" from AuthMiddleware on
  any identity-enforced operation. The error envelope is produced server-side
  by the auth plugin in the middleware pipeline — not synthesised by the
  conformance harness or transport client. Both send and recv are tested.
  The fixture relies on strict-mode (agents: list declared), which disables
  auto-registration and forces AuthMiddleware to reject unknown credentials.

agents:
  - id: agent-registered-a
    credential: secret-registered-a
    registered: true
  - id: agent-unregistered-x
    credential: INVALID-UNREGISTERED-CREDENTIAL
    registered: false  # not provisioned — unknown to AuthMiddleware

sequence:
  - id: rejected-send
    as_agent: agent-unregistered-x
    operation: send
    input:
      channel: "test:server-side-reject"
      body:
        type: status_update
        subject: this send must be rejected server-side
    expected_error:
      error_code: "identity_failure"
      message: "{{any_string}}"

  - id: rejected-recv
    as_agent: agent-unregistered-x
    operation: recv
    input: {}
    expected_error:
      error_code: "identity_failure"
      message: "{{any_string}}"

assertions: []
